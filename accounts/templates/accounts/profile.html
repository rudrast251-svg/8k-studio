{% extends 'studio/dashboard_base.html' %}
{% block dash_title %}Profile{% endblock %}
{% block dash_content %}
<div class="page-head">
  <div>
    <h1>Profile</h1>
    <p class="text-dim">Manage your account details.</p>
  </div>
</div>
<div class="glass card" style="max-width:520px;">
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label>Name</label>
      <input class="field-input" type="text" name="username" value="{{ user.username }}">
    </div>
    <div class="field">
      <label>Email</label>
      <input class="field-input" type="email" value="{{ user.email }}" disabled>
      <div class="field-hint">Email cannot be changed in this demo.</div>
    </div>
    <div class="field">
      <label>Company / studio name</label>
      <input class="field-input" type="text" name="company_name" value="{{ user.company_name }}">
    </div>
    <button type="submit" class="btn btn-primary">Save changes</button>
  </form>
</div>
{% endblock %}
