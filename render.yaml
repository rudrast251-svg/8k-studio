services:
  - type: web
    name: 8k-studio-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: 8k-studio-db
          property: connectionString
      - key: SITE_BASE_URL
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: UPI_ID
        sync: false
      - key: UPI_PAYEE_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        value: rudrast251@gmail.com
      # Sign up free at resend.com, create an API key, then set
      # EMAIL_BACKEND to django.core.mail.backends.smtp.EmailBackend and
      # EMAIL_HOST_PASSWORD to that key in the Render dashboard. Until then
      # notification emails just log to the service's console output.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: EMAIL_HOST
        value: smtp.resend.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: resend
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "8K Studio <onboarding@resend.dev>"

  - type: worker
    name: 8k-studio-worker
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py process_jobs --loop"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: 8k-studio-db
          property: connectionString
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: 8k-studio-db
    plan: free
