services:
  - type: web
    name: 8k-studio-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: 8k-studio-db
          property: connectionString
      - key: SITE_BASE_URL
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: UPI_ID
        sync: false
      - key: UPI_PAYEE_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: worker
    name: 8k-studio-worker
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py process_jobs --loop"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: 8k-studio-db
          property: connectionString
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: 8k-studio-db
    plan: free
